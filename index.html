<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>for my queen</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: pink;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    h1 {
        font-size: 40px;
        color: white;
        text-align: center;
    }

    #message {
        font-size: 35px;
        color: white;
        margin-top: 20px;
        display: none;
        text-align: center;
    }

    .buttons {
        margin-top: 20px;
        position: relative;
        width: 350px;
        height: 350px;
        border: 0px dashed white; /* просто чтобы видеть границы */
    }

    button {
        padding: 15px 30px;
        font-size: 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        position: absolute;
        transition: 0.2s;
    }

    #yes {
        background: green;
        color: white;
        left: 30px;
        top: 50px;
    }

    #no {
        background: red;
        color: white;
        left: 150px;
        top: 50px;
    }

    .heart {
        position: absolute;
        font-size: 20px;
        animation: float 2s linear forwards;
    }

    @keyframes float {
        0% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-200px); }
    }
</style>
</head>
<body>

<h1 id="mainText">Че дошла до сюда?</h1>
<div id="message">Переходи в следующий этап❤️ @saakonxc maybe my social media</div>

<div class="buttons" id="box">
    <button id="yes">ДААА!</button>
    <button id="no">Нет</button>
</div>

<script>
let yesBtn = document.getElementById("yes");
let noBtn = document.getElementById("no");
let box = document.getElementById("box");
let message = document.getElementById("message");
let mainText = document.getElementById("mainText");

let yesSize = 1;

noBtn.addEventListener("click", () => {
    yesSize += 0.3;
    yesBtn.style.transform = `scale(${yesSize})`;

    // размеры контейнера
    let boxRect = box.getBoundingClientRect();

    // ограничение внутри блока
    let maxX = boxRect.width - noBtn.offsetWidth;
    let maxY = boxRect.height - noBtn.offsetHeight;

    let x = Math.random() * maxX;
    let y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

yesBtn.addEventListener("click", () => {
    mainText.style.display = "none";
    box.style.display = "none";
    message.style.display = "block";

    for (let i = 0; i < 30; i++) {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";

        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.top = Math.random() * window.innerHeight + "px";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 2000);
    }
});
</script>

</body>
</html>
